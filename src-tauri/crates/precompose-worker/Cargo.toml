[package]
name = "video-creater-precompose-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "MIT"

[dependencies]
dotlottie-rs = { path = "../../vendor/dotlottie-rs", default-features = false, features = ["dotlottie", "tvg", "tvg-cpu", "tvg-jpg", "tvg-lottie-expressions", "tvg-png", "tvg-webp"] }
png = "0.18.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sha2 = "0.10.9"
video-creater-precompose-protocol = { path = "../precompose-protocol" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["png"] }
tempfile = "3.14.0"
video-creater = { path = "../..", default-features = false, features = ["ges-render", "gpu-render"] }
