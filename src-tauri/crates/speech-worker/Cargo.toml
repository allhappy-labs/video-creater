[package]
name = "video-creater-speech-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "MIT"
build = "build.rs"

[[bin]]
name = "video-creater-speech"
path = "src/main.rs"

[features]
default = []
# Links the TTS-disabled sherpa-onnx + ONNX Runtime shared libraries and system GStreamer.
# Enabled by scripts/build-linux-speech-worker.mjs; without it the protocol logic still builds
# and tests, and the binary reports that the native speech runtime is unavailable.
native = [
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-audio",
  "dep:ort",
  "dep:sherpa-onnx-sys",
]

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", features = ["v1_22"], optional = true }
gstreamer-app = { version = "0.25", features = ["v1_22"], optional = true }
gstreamer-audio = { version = "0.25", features = ["v1_22"], optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-17", "alternative-backend"], optional = true }
sherpa-onnx-sys = { path = "../../vendor/sherpa-onnx-sys", optional = true }

[dev-dependencies]
tempfile = "3.14.0"
