[package]
name = "video-creater-provider-e2e-harness"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
png = "0.18.1"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde_json = "1.0.134"
video_creater_lib = { package = "video-creater", path = "../..", default-features = false }
